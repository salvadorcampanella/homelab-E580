# Homepage — Global Widgets (top of the dashboard)
# Docs: https://gethomepage.dev/widgets/

# Date and time
- datetime:
    text_size: xl
    format:
      dateStyle: long
      timeStyle: short
      hour12: false

# Search bar
- search:
    provider: google
    target: _blank

# Weather forecast (Open-Meteo with browser geolocation)
- openmeteo:
    units: metric
    cache: 15

# Server Information
- resources:
    label: Casita Server
    cpu: true
    memory: true
    cputemp: true
    uptime: true
    disk:
      - /
      - /mnt/ev_deluxe
    expanded: true
    units: metric
    refresh: 3000

# Homepage — General Configuration
# Docs: https://gethomepage.dev/configs/settings/

title: Casita Homelab
description: Personal homelab control panel

# Interface language
language: en

# Clean status indicators (colored dots)
statusStyle: dot

# Quicklaunch search modal (Ctrl+K / Cmd+K)
quicklaunch: true

# Show client IP and network stats in header/footer
showStats: true

# Favicon icon
favicon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/homepage.png

# Top bar style
headerStyle: clean

# Standard layout configuration
layout:
  System Overview:
    style: row
    columns: 3
  Live:
    style: row
    columns: 2
  Infrastructure & Automation:
    style: row
    columns: 2
  Media Center:
    style: row
    columns: 3

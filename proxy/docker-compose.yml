services:
  app:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ${DOCKER_DATA_PATH}/npm/config:/data
      - ${DOCKER_DATA_PATH}/npm/letsencrypt:/etc/letsencrypt
    environment:
      DB_MYSQL_HOST: ${DB_MYSQL_HOST:-npm-db}
      DB_MYSQL_PORT: ${DB_MYSQL_PORT:-3306}
      DB_MYSQL_USER: ${DB_MYSQL_USER:-npm}
      DB_MYSQL_PASSWORD: ${DB_MYSQL_PASSWORD}
      DB_MYSQL_NAME: ${DB_MYSQL_NAME:-npm}
    depends_on:
      - db
    networks:
      - proxy-nw

  db:
    image: 'jc21/mariadb-aria:latest'
    container_name: npm-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_MYSQL_NAME:-npm}
      MYSQL_USER: ${DB_MYSQL_USER:-npm}
      MYSQL_PASSWORD: ${DB_MYSQL_PASSWORD}
    volumes:
      - ${DOCKER_DATA_PATH}/npm/mysql:/var/lib/mysql
    networks:
      - proxy-nw

networks:
  proxy-nw:
    name: proxy-nw
    driver: bridge

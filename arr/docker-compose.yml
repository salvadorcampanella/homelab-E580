# Stack *arr + Jellyfin — Media management and streaming
# Radarr (movies), Sonarr (series), Lidarr (music), Prowlarr (indexers),
# Bazarr (subtitles), qBittorrent (downloads), Jellyfin (streaming)
# FlareSolverr (bypass Cloudflare for indexers)
# Docs: https://wiki.servarr.com/ | https://jellyfin.org/docs/ | https://github.com/FlareSolverr/FlareSolverr

# ---------------------------------------------------------------------------
# GPU / Hardware-acceleration anchor — Intel UHD 620 (QuickSync / VAAPI)
# ---------------------------------------------------------------------------
# Reusable block: any future service (Immich, Plex, Handbrake…) can inherit
# this configuration with <<: *gpu-access in its service definition.
#
# Host GIDs (auto-detected, Ubuntu 22.04):
#   video  → 44   (owns /dev/dri/card1)
#   render → 992  (owns /dev/dri/renderD128)
#
# To verify on the host:  getent group video render
# ---------------------------------------------------------------------------
x-gpu-access: &gpu-access
  devices:
    - /dev/dri/renderD128:/dev/dri/renderD128
    - /dev/dri/card1:/dev/dri/card1
  group_add:
    - "44"   # video
    - "992"  # render
services:

  # -------------------------------------------------------------------
  # Radarr — Movie management
  # -------------------------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ${DOCKER_DATA_PATH}/arr/radarr:/config
      - ${DOCKER_DATA_PATH}/media/movies:/movies
      - ${DOCKER_DATA_PATH}/arr/downloads:/downloads
    networks:
      - proxy-nw

  # -------------------------------------------------------------------
  # Sonarr — TV series management
  # -------------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ${DOCKER_DATA_PATH}/arr/sonarr:/config
      - ${DOCKER_DATA_PATH}/media/tv:/tv
      - ${DOCKER_DATA_PATH}/arr/downloads:/downloads
    networks:
      - proxy-nw

  # -------------------------------------------------------------------
  # Lidarr — Music management
  # -------------------------------------------------------------------
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ${DOCKER_DATA_PATH}/arr/lidarr:/config
      - ${DOCKER_DATA_PATH}/media/music:/music
      - ${DOCKER_DATA_PATH}/arr/downloads:/downloads
    networks:
      - proxy-nw

  # -------------------------------------------------------------------
  # Prowlarr — Indexer manager (torrents/usenet indexers)
  # sysctls: disables IPv6 to avoid SSL issues with Cloudflare indexers
  # dns: forces reliable resolution (1.1.1.1/8.8.8.8) instead of host DNS
  # -------------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ${DOCKER_DATA_PATH}/arr/prowlarr:/config
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    networks:
      - proxy-nw

  # -------------------------------------------------------------------
  # Bazarr — Subtitles management
  # -------------------------------------------------------------------
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ${DOCKER_DATA_PATH}/arr/bazarr:/config
      - ${DOCKER_DATA_PATH}/media/movies:/movies
      - ${DOCKER_DATA_PATH}/media/tv:/tv
    networks:
      - proxy-nw

  # -------------------------------------------------------------------
  # Gluetun — VPN Client for PIA (Kill-Switch & Port Forwarding)
  # qBittorrent routes all its network traffic through this container.
  # Aliased as 'qbittorrent' on proxy-nw so NPM and *arr continue to reach :8080.
  # -------------------------------------------------------------------
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${PIA_USER}
      - OPENVPN_PASSWORD=${PIA_PASSWORD}
      - SERVER_REGIONS=${PIA_SERVER_REGIONS:-Spain,France,Netherlands,Switzerland,Germany}
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_STATUS_FILE=/tmp/gluetun/forwarded_port
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ${DOCKER_DATA_PATH}/arr/gluetun:/tmp/gluetun
    networks:
      proxy-nw:
        aliases:
          - qbittorrent

  # -------------------------------------------------------------------
  # qBittorrent — Download client (routed through Gluetun VPN)
  # -------------------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Madrid}
      - WEBUI_PORT=8080
    volumes:
      - ${DOCKER_DATA_PATH}/arr/qbittorrent:/config
      - ${DOCKER_DATA_PATH}/arr/downloads:/downloads
      - ${DOCKER_DATA_PATH}/arr/gluetun:/tmp/gluetun:ro

  # -------------------------------------------------------------------
  # Jellyfin — Media streaming server
  # Intel QuickSync (VAAPI) hardware transcoding enabled via x-gpu-access.
  # In Jellyfin UI: Dashboard > Playback > Transcoding
  #   → Hardware acceleration: Video Acceleration API (VAAPI)
  #   → VA-API Device: /dev/dri/renderD128
  # -------------------------------------------------------------------
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    <<: *gpu-access
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Madrid}
      # Intel VAAPI driver (i965 is more compatible with some UHD 620 implementations than iHD)
      - LIBVA_DRIVER_NAME=i965
    volumes:
      # config: Jellyfin database, metadata, transcoding cache — needs rw.
      # Run once on host if you see permission errors:
      #   sudo chown -R 1000:1000 ${DOCKER_DATA_PATH}/arr/jellyfin
      - ${DOCKER_DATA_PATH}/arr/jellyfin:/config
      - ${DOCKER_DATA_PATH}/media/movies:/data/movies
      - ${DOCKER_DATA_PATH}/media/tv:/data/tv
      - ${DOCKER_DATA_PATH}/media/music:/data/music
      - ${DOCKER_DATA_PATH}/media/courses:/data/courses
      - ${DOCKER_DATA_PATH}/media/entertainment:/data/entertainment
    networks:
      - proxy-nw

  # -------------------------------------------------------------------
  # FlareSolverr — Proxy to bypass Cloudflare on Prowlarr indexers
  # Docs: https://github.com/FlareSolverr/FlareSolverr
  # Configure in Prowlarr: Settings > Indexers > Add Indexer Proxy
  #   Type: FlareSolverr | URL: http://flaresolverr:8191
  # sysctls/dns: same IPv6/DNS fix as prowlarr
  # -------------------------------------------------------------------
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Madrid}
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      # LOG_HTML: false   # uncomment to debug HTML responses
      # CAPTCHA_SOLVER: none  # options: none, hcaptcha-solver, 9kw, anticaptcha, deathbycaptcha
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    # NOT exposed to host — internal access via proxy-nw (container: flaresolverr:8191)
    networks:
      - proxy-nw

  # -------------------------------------------------------------------
  # MeTube — yt-dlp web UI to download YouTube videos (courses, entertainment)
  # Docs: https://github.com/alexta69/metube
  # In the UI pick MP4 and a custom folder: courses or entertainment.
  # Files land in ${DOCKER_DATA_PATH}/media/<folder>
  # For music use metube-music (below).
  # -------------------------------------------------------------------
  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: metube
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - DOWNLOAD_DIR=/downloads
      - STATE_DIR=/state
      - TEMP_DIR=/state/tmp
      - CUSTOM_DIRS=true
      - CREATE_CUSTOM_DIRS=false
      - DEFAULT_FOLDER=entertainment
    volumes:
      - ${DOCKER_DATA_PATH}/media/courses:/downloads/courses
      - ${DOCKER_DATA_PATH}/media/entertainment:/downloads/entertainment
      - ${DOCKER_DATA_PATH}/arr/metube:/state
    # NOT exposed to host — internal access via proxy-nw (container: metube:8081)
    networks:
      - proxy-nw

  # -------------------------------------------------------------------
  # MeTube Music — same app, writes straight into the Lidarr music library
  # using the same layout as Lidarr: Artist/Album/NN - Artist - Title.mp3
  # (tags come from YouTube; tracks without album go to Artist/Singles).
  # In the UI pick Audio > MP3 320. State lives outside the library.
  # -------------------------------------------------------------------
  metube-music:
    image: ghcr.io/alexta69/metube:latest
    container_name: metube-music
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - DOWNLOAD_DIR=/music
      - STATE_DIR=/state
      - TEMP_DIR=/state/tmp
      - CUSTOM_DIRS=false
      - OUTPUT_TEMPLATE=%(album_artist,artist,uploader)s/%(album|Singles)s/%(track_number&{:02d} - |)s%(artist,uploader)s - %(title)s.%(ext)s
      - OUTPUT_TEMPLATE_PLAYLIST=%(album_artist,artist,uploader)s/%(album|Singles)s/%(track_number&{:02d} - |)s%(artist,uploader)s - %(title)s.%(ext)s
      - OUTPUT_TEMPLATE_CHANNEL=%(album_artist,artist,uploader)s/%(album|Singles)s/%(track_number&{:02d} - |)s%(artist,uploader)s - %(title)s.%(ext)s
    volumes:
      - ${DOCKER_DATA_PATH}/media/music:/music
      - ${DOCKER_DATA_PATH}/arr/metube-music:/state
    # NOT exposed to host — internal access via proxy-nw (container: metube-music:8081)
    networks:
      - proxy-nw


networks:
  proxy-nw:
    external: true
